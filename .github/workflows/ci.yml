# Acceptance gate on every push / PR: `npm run verify` (build → unit →
# integration → E2E smoke → 91-control button audit) on Linux and Windows.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux GUI deps (Xvfb + a window manager for the button audit)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb openbox

      - run: npm ci

      - name: npm run verify
        run: npm run verify

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: |
            artifacts/acceptance-report.md
            artifacts/verify-raw.json
            artifacts/button-audit/
          if-no-files-found: warn

# Installer pipeline (design/37-packaging-release.md).
#   push a tag vX.Y.Z  → build Windows/Linux/macOS installers, smoke-test the
#                        packaged app on each OS, publish a GitHub Release with
#                        the installers + SHA256SUMS.txt + latest.json (F21
#                        updater manifest)
#   Actions → Release → Run workflow, version "0.2.0"
#                      → same build + smoke, then publish release v0.2.0 and
#                        create its tag on the chosen branch's commit (for
#                        when a tag cannot be pushed from where you are)
#   Actions → Release → Run workflow, no version
#                      → installers as workflow artifacts only (tick
#                        "publish" to also create a draft release)
#   push touching packaging files → build + packaged smoke only (never publishes),
#                        so a broken installer is caught before the next tag
name: Release

on:
  push:
    tags: ['v*.*.*']
    # branch pushes: only when packaging changed (path filters never apply to tags)
    branches: ['**']
    paths:
      - electron-builder.yml
      - package.json
      - package-lock.json
      - build/**
      - app/shared/asar-path.js
      - scripts/build.mjs
      - scripts/setup-electron-sqlite.mjs
      - scripts/smoke-packaged.mjs
      - scripts/release-manifest.mjs
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish this version as a release, e.g. 0.2.0 (creates tag v0.2.0 on this commit). Empty = build only'
        type: string
        default: ''
      publish:
        description: 'No version given: also create a draft GitHub Release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # resolve the version once and refuse a release that already exists before
  # spending ~20 min of runner time on builds
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Resolve and check version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then V="${INPUT_VERSION#v}"
          else echo "no release version: build only"; exit 0; fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like 1.2.3, got '$V'"; exit 1
          fi
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release v$V already exists"; exit 1
          fi
          # a manual run creates the tag itself — an existing tag means this
          # version was already cut elsewhere
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$V" >/dev/null 2>&1; then
            echo "::error::tag v$V already exists; push that tag or pick a new version"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "release version: $V"

  build:
    needs: preflight
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: dist-installer/*.exe
          - os: ubuntu-latest
            files: |
              dist-installer/*.AppImage
              dist-installer/*.deb
          - os: macos-latest
            files: dist-installer/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Linux GUI deps (packaged smoke test)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb openbox

      - run: npm ci

      - name: Set release version
        if: needs.preflight.outputs.version != ''
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.preflight.outputs.version }}"

      - name: Build installers (npm run dist)
        run: npm run dist
        env:
          # no code-signing certificates in this repo: unsigned builds
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test the packaged app
        run: node scripts/smoke-packaged.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    if: needs.preflight.outputs.version != '' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set release version
        if: needs.preflight.outputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.preflight.outputs.version }}"

      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist-installer
          merge-multiple: true

      - name: SHA256SUMS + updater manifest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/release-manifest.mjs --dir dist-installer \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}" \
            --notes "MyAgent v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release version (tag push or the version input) publishes for
          # real and creates the tag at --target; "publish" alone → draft
          DRAFT=""
          if [ -z "${{ needs.preflight.outputs.version }}" ]; then DRAFT="--draft"; fi
          gh release create "v${VERSION}" $DRAFT \
            --title "MyAgent v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --notes "Installers: Windows (NSIS .exe), Linux (.AppImage / .deb), macOS (.dmg, unsigned). Verify downloads with SHA256SUMS.txt." \
            dist-installer/*.exe dist-installer/*.AppImage dist-installer/*.deb dist-installer/*.dmg \
            dist-installer/SHA256SUMS.txt dist-installer/latest.json

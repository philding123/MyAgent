<!doctype html>
<html>
<head><meta charset="utf-8"><title>MyAgent Settings</title>
<link rel="stylesheet" href="./style.css"></head>
<body data-theme="dark" class="settings-page">
<h1>Settings</h1>
<section>
  <h2>Model</h2>
  <label>Base URL <input id="llm-base" placeholder="http://127.0.0.1:11434/v1"></label>
  <label>API Key <input id="llm-key" type="password" placeholder="stored encrypted"></label>
  <label>Model <input id="llm-model" placeholder="local-model"></label>
  <button id="btn-test-llm" class="primary">Test connection</button>
  <span id="llm-test-result"></span>
</section>
<section>
  <h2>Appearance</h2>
  <label>Theme
    <select id="theme-select"><option value="dark">Dark</option><option value="light">Light</option></select>
  </label>
</section>
<section>
  <h2>Engine</h2>
  <label><input type="checkbox" id="prewarm-chk"> Prewarm pool (faster first token)</label>
</section>
<section>
  <h2>Updates (F21)</h2>
  <label>Manifest URL <input id="update-url" placeholder="https://example.com/myagent/latest.json"></label>
  <button id="btn-update-check" class="primary">Check now</button>
  <button id="btn-update-apply">Apply downloaded update</button>
  <span id="update-msg"></span>
</section>
<section>
  <h2>Skill market (F25)</h2>
  <label>Index URL <input id="market-url" placeholder="https://example.com/market/index.json (逗号分隔多个)"></label>
  <label><input type="checkbox" id="market-insecure"> Allow http:// sources (loopback/testing)</label>
  <div><input id="market-keywords" placeholder="code review"><button id="btn-market-search">Search</button><button id="btn-market-install">Install first hit</button></div>
  <span id="market-msg"></span>
</section>
<section>
  <h2>Sync (F26)</h2>
  <label>Target directory <input id="sync-dir" placeholder="D:\sync\myagent (网盘目录即可)"></label>
  <label><input type="checkbox" id="sync-auto"> Auto push after changes</label>
  <div>
    <button id="btn-sync-save" class="primary">Save target</button>
    <button id="btn-sync-push">Push now</button>
    <button id="btn-sync-pull">Pull now</button>
  </div>
  <span id="sync-msg"></span>
</section>
<section>
  <h2>Cloud sandbox (F27)</h2>
  <label>Backend
    <select id="sandbox-backend"><option value="local">local (本机沙箱)</option><option value="cloud">cloud (e2b 兼容)</option></select>
  </label>
  <label>API URL <input id="sandbox-cloud-url" placeholder="https://api.e2b.app"></label>
  <label>Sandbox ID <input id="sandbox-cloud-id" placeholder="sb-…"></label>
  <label>API Key <input id="sandbox-cloud-key" type="password" placeholder="stored encrypted"></label>
</section>
<section>
  <h2>A2A server (F28)</h2>
  <label><input type="checkbox" id="a2a-enabled"> Expose loopback A2A endpoint (message/send)</label>
  <span id="a2a-msg"></span>
</section>
<section>
  <h2>Skills</h2>
  <ul id="skill-list"></ul>
  <div>
    <button id="btn-import-skill">Import skill (.zip / folder)</button>
    <span id="skill-msg"></span>
  </div>
</section>
<section>
  <h2>Memory</h2>
  <div><input id="mem-input" placeholder="remember: I prefer concise answers"><button id="btn-mem-add">Add</button></div>
  <ul id="mem-list"></ul>
</section>
<section>
  <h2>IM channels (F23)</h2>
  <ul id="im-list"></ul>
  <div>
    <select id="im-channel">
      <option value="telegram">telegram</option>
      <option value="webhook">webhook</option>
      <option value="slack">slack</option>
      <option value="discord">discord</option>
      <option value="dingtalk">dingtalk</option>
      <option value="feishu">feishu</option>
    </select>
    <input id="im-token" type="password" placeholder="bot token（存入加密 vault）">
    <button id="btn-im-save">Save token</button>
    <button id="btn-im-start">Start</button>
    <button id="btn-im-stop">Stop</button>
  </div>
  <span id="im-msg"></span>
</section>
<section>
  <h2>Self check</h2>
  <pre id="selfcheck"></pre>
</section>
<section>
  <h2>Data</h2>
  <button id="btn-export">Export sessions JSON</button>
  <button id="btn-clear" class="danger">Clear all data</button>
  <span id="data-msg"></span>
</section>
<script src="./dist/settings.js"></script>
</body>
</html>

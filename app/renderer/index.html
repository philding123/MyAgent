<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>MyAgent</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="../node_modules/highlight.js/styles/github-dark.css">
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
</head>
<body data-theme="light">
<div id="app">
  <aside id="sidebar">
    <button id="btn-new" title="新建任务"><span class="plus">＋</span>新建任务</button>
    <div class="side-section-label">任务</div>
    <ul id="session-list"></ul>
    <div id="side-foot">
      <span class="user-avatar" title="本地模式">M</span>
      <button id="btn-settings">设置</button>
      <span id="daemon-status" class="status-dot ok" title="daemon connected"></span>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div id="session-title">—</div>
      <div id="mode-switch">
        <button data-mode="ask" title="只读问答">ask</button>
        <button data-mode="plan" title="读 + 规划，写入需批准">plan</button>
        <button data-mode="craft" title="完整智能体">craft</button>
      </div>
      <button id="btn-terminal" class="icon-btn" title="终端">▮</button>
      <button id="btn-preview" class="icon-btn" title="预览文件 (docx/pdf/xlsx/pptx…)">▤</button>
      <button id="btn-search" class="icon-btn" title="全局搜索">⌕</button>
    </header>
    <div id="messages"></div>
    <div id="confirm-bar" class="hidden"></div>
    <div id="terminal-panel" class="hidden">
      <div id="terminal-view"></div>
    </div>
    <footer id="composer">
      <div class="composer-slot">
        <div class="composer-card">
          <textarea id="input" rows="2" placeholder="给 MyAgent 发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
          <div class="composer-foot">
            <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
            <button id="btn-send">发送</button>
          </div>
        </div>
      </div>
    </footer>
  </main>
</div>
<script src="./dist/bundle.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>MyAgent</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="../node_modules/highlight.js/styles/github-dark.css">
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
</head>
<body data-theme="dark">
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <span class="logo">MyAgent</span>
      <button id="btn-new" title="New session">+</button>
    </div>
    <ul id="session-list"></ul>
    <div class="side-foot">
      <button id="btn-settings">Settings</button>
      <span id="daemon-status" class="status-dot ok"></span>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div id="session-title">—</div>
      <div id="mode-switch">
        <button data-mode="ask" title="Read-only Q&A">ask</button>
        <button data-mode="plan" title="Read + plan, writes need approval">plan</button>
        <button data-mode="craft" title="Full agent">craft</button>
      </div>
      <button id="btn-terminal" title="Toggle terminal">▮ terminal</button>
      <button id="btn-preview" title="Preview a file (docx/pdf/xlsx/pptx…)">▤ preview</button>
      <button id="btn-search" title="Global search">⌕</button>
    </header>
    <div id="messages"></div>
    <div id="confirm-bar"></div>
    <div id="terminal-panel" class="hidden">
      <div id="terminal-view"></div>
    </div>
    <footer id="composer">
      <textarea id="input" rows="2" placeholder="Message MyAgent… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="btn-send">Send</button>
    </footer>
  </main>
</div>
<script src="./dist/bundle.js"></script>
</body>
</html>

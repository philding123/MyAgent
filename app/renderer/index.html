<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>MyAgent</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="../node_modules/highlight.js/styles/github-dark.css">
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
</head>
<body data-theme="light">
<!-- F38 v5.8.2 band: app icons + menu labels + window controls (frameless) -->
<div id="band">
  <button id="band-toggle" class="band-icon" title="折叠/展开侧栏">
    <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 3h12M2 8h12M2 13h12" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <button id="band-search" class="band-icon" title="全局搜索 (Ctrl+Shift+F)">
    <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2L14 14" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
  <span class="menu-label" data-menu="edit">编辑(E)</span>
  <span class="menu-label" data-menu="window">窗口(W)</span>
  <span class="menu-label" data-menu="help">帮助(H)</span>
  <span class="menu-label" data-menu="about">关于(A)</span>
  <div class="band-spring"></div>
  <button id="win-min" class="band-icon" title="最小化">—</button>
  <button id="win-max" class="band-icon" title="最大化">□</button>
  <button id="win-close" class="band-icon band-close" title="关闭">✕</button>
</div>
<div id="app">
  <aside id="sidebar">
    <div class="sb-head">
      <div>
        <div class="brand">MyAgent</div>
        <div class="version" id="app-version"></div>
      </div>
    </div>
    <nav id="sb-nav">
      <button class="nav-item active" id="btn-new" title="新建任务"><span class="nav-ico">＋</span>新建任务</button>
      <button class="nav-item" id="nav-assistant" data-panel="presets"><span class="nav-ico">🤖</span>助理</button>
      <button class="nav-item" id="nav-market" data-panel="market"><span class="nav-ico">⚙</span>技能市场</button>
      <button class="nav-item" id="nav-tasks" data-panel="tasks"><span class="nav-ico">⏰</span>定时任务</button>
      <button class="nav-item" id="nav-library" data-panel="library"><span class="nav-ico">📚</span>资料库</button>
      <button class="nav-item" id="nav-skills" data-panel="skills"><span class="nav-ico">✦</span>技能</button>
      <button class="nav-item" id="nav-connectors" data-panel="connectors"><span class="nav-ico">⛓</span>连接器</button>
      <button class="nav-item" id="nav-memory" data-panel="memory"><span class="nav-ico">◈</span>记忆</button>
      <button class="nav-item" id="nav-search"><span class="nav-ico">⌕</span>全局搜索</button>
    </nav>
    <div class="sb-scroll">
      <div class="side-section-label" id="tasks-label">任务</div>
      <ul id="session-list"></ul>
      <div id="space-groups"></div>
    </div>
    <div id="side-foot">
      <span class="user-avatar" title="本地模式">M</span>
      <button id="btn-settings">设置</button>
      <span id="daemon-status" class="status-dot ok" title="daemon connected"></span>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div id="crumb">
        <span id="crumb-space" class="hidden"></span>
        <span id="crumb-sep" class="hidden">/</span>
        <span id="session-title">—</span>
      </div>
      <div id="mode-switch">
        <button data-mode="ask" title="只读问答">ask</button>
        <button data-mode="plan" title="读 + 规划，写入需批准">plan</button>
        <button data-mode="craft" title="完整智能体">craft</button>
      </div>
      <button id="btn-terminal" class="icon-btn" title="终端">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 3.5h12v9.5H2z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 6l2.5 2-2.5 2M8 10.5h4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button id="btn-preview" class="icon-btn" title="预览文件 (docx/pdf/xlsx/pptx…)">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M4 1.5h5.5L12.5 4.5V14.5H4z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 7h4M6 9.5h4M6 12h2.5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="btn-search" class="icon-btn" title="全局搜索">
        <svg viewBox="0 0 16 16" width="15" height="15"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 10.2L14 14" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </header>
    <div id="messages"></div>
    <div id="confirm-bar" class="hidden"></div>
    <div id="progress-line" class="hidden"></div>
    <div id="terminal-panel" class="hidden">
      <div id="terminal-view"></div>
    </div>
    <footer id="composer">
      <div class="composer-slot">
        <div class="composer-card">
          <textarea id="input" rows="2" placeholder="今天帮你做些什么？@ 添加上下文，/调用技能与指令"></textarea>
          <div class="composer-foot">
            <button id="btn-plus" class="icon-btn" title="添加">＋</button>
            <button id="btn-context" class="icon-btn" title="@ 添加上下文文件">@</button>
            <button id="btn-slash" class="icon-btn" title="/ 调用技能与指令">/</button>
            <span class="composer-hint">Enter 发送 · Shift+Enter 换行</span>
            <span id="composer-model" class="model-chip" title="模型（设置中修改）"></span>
            <button id="btn-send" title="发送">↑</button>
          </div>
        </div>
        <div id="composer-sub">
          <span class="sub-chip" id="sub-workspace" title="当前会话工作空间">选择工作空间 ▾</span>
          <span class="sub-chip sub-warn" id="sub-mode" title="点击切换模式">允许完全访问 ▾</span>
        </div>
        <div id="suggestion-list"></div>
      </div>
    </footer>
    <div id="disclaimer">内容由 AI 生成，请核实重要信息</div>
  </main>
</div>
<script src="./dist/bundle.js"></script>
</body>
</html>
